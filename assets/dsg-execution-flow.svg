<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="254" viewBox="0 0 1280 254" role="img" aria-labelledby="title desc">
<title id="title">DSG ONE governed execution flow</title>
<desc id="desc">Five stages: agent, plan and scope, DSG Spacetime, provider, evidence and replay. Policy and approval are evaluated before execution.</desc>
<defs><linearGradient id="surface" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0A1127"/><stop offset="1" stop-color="#121C3B"/></linearGradient><linearGradient id="route" x1="0" x2="1"><stop stop-color="#37D9E6"/><stop offset="1" stop-color="#9C7EFF"/></linearGradient></defs>
