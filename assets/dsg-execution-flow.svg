<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
<rect x="30" y="49" width="202" height="121" rx="15" fill="#132447" stroke="#476C9F" stroke-width="1"/><text x="131" y="99" font-size="21" font-weight="800" fill="#F2F7FF">AGENT</text><text x="131" y="125" font-size="15" fill="#AABDDC">Propose actions</text><rect x="284" y="49" width="202" height="121" rx="15" fill="#132447" stroke="#476C9F" stroke-width="1"/><text x="385" y="99" font-size="21" font-weight="800" fill="#F2F7FF">PLAN &amp; SCOPE</text><text x="385" y="125" font-size="15" fill="#AABDDC">Bound authorization</text><rect x="538" y="40" width="202" height="139" rx="15" fill="#20295D" stroke="#8D8AFF" stroke-width="2.4"/><text x="639" y="88" font-size="21" font-weight="800" fill="#9AEFFF">SPACETIME</text><text x="639" y="117" font-size="15" fill="#AABDDC">Policy + approval</text><text x="639" y="140" font-size="15" fill="#AABDDC">Allow / block</text><rect x="792" y="49" width="202" height="121" rx="15" fill="#132447" stroke="#476C9F" stroke-width="1"/><text x="893" y="99" font-size="21" font-weight="800" fill="#F2F7FF">PROVIDER</text><text x="893" y="125" font-size="15" fill="#AABDDC">Browser / MCP / API</text><rect x="1046" y="49" width="202" height="121" rx="15" fill="#132447" stroke="#476C9F" stroke-width="1"/><text x="1147" y="99" font-size="21" font-weight="800" fill="#F2F7FF">EVIDENCE</text><text x="1147" y="125" font-size="15" fill="#AABDDC">Receipt / replay</text><text x="640" y="221" fill="#B2CAEE" font-size="15" letter-spacing="1.6">NO DIRECT MODEL-TO-PROVIDER BYPASS  •  EXECUTION REQUIRES SCOPE &amp; POLICY</text>
</g></svg>